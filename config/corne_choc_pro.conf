# Enable mouse emulation.
# CONFIG_ZMK_POINTING=y

# Enter idle after 30 minutes and deep sleep after one hour of inactivity.
# 1.800.000 ms = 30 min, 3.600.000 ms = 60 min
CONFIG_ZMK_IDLE_TIMEOUT=1800000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# Keep the display active when the keyboard enters idle.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# Turn the underglow off when the keyboard enters idle.
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Custom keyboard name (max. 16 characters)
CONFIG_ZMK_KEYBOARD_NAME="fukuro"
